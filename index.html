<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการ OT - Employee Portal</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5988/5988246.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800">

  <!-- Top Navbar -->
  <header id="main-header" class="bg-slate-900 text-white shadow-lg hidden">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 p-2 rounded-lg text-white font-bold text-lg">OT</div>
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-none">ระบบขออนุมัติ OT (Employee Portal)</h1>
          <p class="text-xs text-slate-400 mt-1" id="nav-user-info">ยินดีต้อนรับ</p>
        </div>
      </div>
      <button type="button" class="logout-btn bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white border border-red-500/30 px-3 py-1.5 rounded-lg text-xs font-medium transition">
        ออกจากระบบ
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">

    <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm text-center font-medium shadow-sm transition"></div>

    <!-- 1. Login Section -->
    <div id="login-section" class="max-w-md mx-auto my-12 bg-white rounded-2xl shadow-xl border border-slate-100 p-8 space-y-6">
      <div class="text-center space-y-2">
        <div class="inline-flex bg-blue-100 text-blue-600 p-3 rounded-2xl mb-2">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">เข้าสู่ระบบ OT System</h2>
        <p class="text-sm text-slate-500">กรุณากรอกข้อมูลเพื่อเข้าใช้งานระบบ</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ชื่อผู้ใช้งาน (Username)</label>
          <input type="text" id="login-username" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">รหัสผ่าน (Password)</label>
          <input type="password" id="login-password" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
        </div>
        <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/20 transition">
          เข้าสู่ระบบ
        </button>
      </form>

      <div class="text-center text-sm text-slate-500 pt-4 border-t border-slate-100">
        ยังไม่มีบัญชีผู้ใช้? 
        <button type="button" id="go-to-reg-btn" class="text-blue-600 font-semibold hover:underline">ลงทะเบียนพนักงานใหม่</button>
      </div>
    </div>

    <!-- 2. Employee Dashboard Section -->
    <div id="ot-container" class="max-w-4xl mx-auto space-y-6 hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex justify-between items-center">
        <div>
          <h2 class="text-lg font-bold text-slate-800">รายการยื่นขอ OT ของฉัน</h2>
          <p class="text-xs text-slate-500">กดปุ่มด้านขวาเพื่อสร้างคำขออนุมัติ OT ใหม่</p>
        </div>
        <button id="open-ot-modal-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow-md shadow-blue-500/20 flex items-center gap-2 transition">
          <span>+ ยื่นขอ OT</span>
        </button>
      </div>
    </div>

  </main>

  <!-- ==================== POPUP MODAL: ฟอร์มยื่นขอ OT สไตล์รูปภาพ ==================== -->
  <div id="ot-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden transform transition-all border border-slate-100">
      
      <!-- Modal Header -->
      <div class="flex justify-between items-center px-6 pt-5 pb-2">
        <h3 id="modal-title" class="font-bold text-slate-800 text-base flex items-center gap-2">
          <span id="step-badge" class="bg-blue-600 text-white w-6 h-6 rounded-full text-xs flex items-center justify-center">1</span>
          <span id="step-title-text">ส่วนที่ 1: ข้อมูลเวลาปฏิบัติงาน</span>
        </h3>
        <button id="close-ot-modal-btn" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>

      <!-- Modal Body -->
      <div class="p-6 space-y-5">

        <!-- สเต็ปที่ 1: ข้อมูลเวลาปฏิบัติงาน -->
        <div id="ot-modal-step-1" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">วันที่ต้องการขอทำ OT *</label>
            <input type="date" id="ot-date" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">เวลาเริ่ม OT</label>
              <input type="time" id="ot-time-in" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">เวลาสิ้นสุด</label>
              <input type="time" id="ot-time-out" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
          </div>

          <!-- กล่องสรุปชั่วโมง/นาที -->
          <div class="bg-blue-50/70 border border-blue-100 p-4 rounded-xl flex justify-between items-center text-sm text-blue-900">
            <span class="font-medium">รวมเวลาปฏิบัติงานทั้งหมด:</span>
            <span class="font-bold text-blue-600"><span id="calc-result-text">0 ชั่วโมง 0 นาที</span></span>
          </div>

          <div class="flex justify-end pt-2">
            <button type="button" id="btn-next-step-2" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-xl shadow-md transition flex items-center gap-1">
              ถัดไป &rarr;
            </button>
          </div>
        </div>

        <!-- สเต็ปที่ 2: ข้อมูลงานและผู้อนุมัติ -->
        <div id="ot-modal-step-2" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่องาน/โครงการ *</label>
            <select id="ot-project" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="">-- โหลดโครงการ --</option>
              <option value="โครงการระบบ OT PWA">โครงการระบบ OT PWA</option>
              <option value="งานดูแลระบบเซิร์ฟเวอร์">งานดูแลระบบเซิร์ฟเวอร์</option>
              <option value="งานบริการลูกค้าประจำสาขา">งานบริการลูกค้าประจำสาขา</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">เหตุผล/รายละเอียดการทำ OT *</label>
            <textarea id="ot-reason" rows="3" placeholder="อธิบายเนื้องานโดยสังเขป..." class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">หัวหน้าผู้อนุมัติ *</label>
            <select id="ot-approver" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="">-- เลือกหัวหน้าผู้อนุมัติ --</option>
              <option value="hr.faii">คุณฐิติพรรณ สำเภารอด (HR Manager)</option>
            </select>
          </div>

          <div class="flex justify-between items-center pt-2">
            <button type="button" id="btn-back-step-1" class="border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold px-5 py-2.5 rounded-xl transition">
              &larr; ย้อนกลับ
            </button>
            <button type="button" id="btn-submit-ot" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-xl shadow-md transition flex items-center gap-1">
              ตรวจสอบข้อมูล &rarr;
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
    }

    const API_URL = "https://script.google.com/macros/s/AKfycbwSjoKLEOCgYTRuy0nko7WlUwil6suag_7xa6bdtCGjjTbITqWqvQAPB5tdP2fs1JsXig/exec";

    let currentUser = null;

    const mainHeader = document.getElementById('main-header');
    const loginSection = document.getElementById('login-section');
    const otContainer = document.getElementById('ot-container');
    const alertBox = document.getElementById('alert-box');

    window.onload = () => {
      const savedUser = localStorage.getItem('ot_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        routeUser();
      }
    };

    function routeUser() {
      mainHeader.classList.remove('hidden');
      document.getElementById('nav-user-info').textContent = `ผู้ใช้งาน: ${currentUser.fullname || currentUser.username}`;
      loginSection.classList.add('hidden');
      otContainer.classList.remove('hidden');
    }

    function showAlert(message, isError = false) {
      alertBox.textContent = message;
      alertBox.className = `p-4 rounded-xl text-sm text-center font-medium shadow-sm border ${
        isError ? 'bg-red-50 text-red-700 border-red-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'
      }`;
      alertBox.classList.remove('hidden');
    }

    function hideAlert() { alertBox.classList.add('hidden'); }

    // Login Form Submit
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'กำลังตรวจสอบข้อมูล...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'login',
            username: document.getElementById('login-username').value.trim(),
            password: document.getElementById('login-password').value.trim()
          })
        });
        const result = await response.json();

        if (result.status === 'success') {
          currentUser = result.data;
          localStorage.setItem('ot_user', JSON.stringify(currentUser));
          routeUser();
        } else {
          showAlert(result.message, true);
        }
      } catch (err) {
        showAlert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบ';
      }
    });

    document.querySelectorAll('.logout-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        localStorage.removeItem('ot_user');
        location.reload();
      });
    });

    // ================= POPUP MODAL LOGIC =================
    const otModal = document.getElementById('ot-modal');
    const openOtModalBtn = document.getElementById('open-ot-modal-btn');
    const closeOtModalBtn = document.getElementById('close-ot-modal-btn');
    const step1 = document.getElementById('ot-modal-step-1');
    const step2 = document.getElementById('ot-modal-step-2');
    const stepBadge = document.getElementById('step-badge');
    const stepTitleText = document.getElementById('step-title-text');

    openOtModalBtn.addEventListener('click', () => {
      otModal.classList.remove('hidden');
      otModal.classList.add('flex');
    });

    closeOtModalBtn.addEventListener('click', () => {
      otModal.classList.add('hidden');
      otModal.classList.remove('flex');
    });

    // คำนวณชั่วโมงและนาทีอัตโนมัติ
    const otTimeIn = document.getElementById('ot-time-in');
    const otTimeOut = document.getElementById('ot-time-out');
    const calcResultText = document.getElementById('calc-result-text');

    function calculateTimeDifference() {
      if (otTimeIn.value && otTimeOut.value) {
        const [hIn, mIn] = otTimeIn.value.split(':').map(Number);
        const [hOut, mOut] = otTimeOut.value.split(':').map(Number);

        let startMinutes = hIn * 60 + mIn;
        let endMinutes = hOut * 60 + mOut;

        if (endMinutes < startMinutes) {
          endMinutes += 24 * 60; // กรณีข้ามคืน
        }

        const diffMinutes = endMinutes - startMinutes;
        const hours = Math.floor(diffMinutes / 60);
        const minutes = diffMinutes % 60;

        calcResultText.textContent = `${hours} ชั่วโมง ${minutes} นาที`;
        return diffMinutes;
      }
      calcResultText.textContent = `0 ชั่วโมง 0 นาที`;
      return 0;
    }

    otTimeIn.addEventListener('change', calculateTimeDifference);
    otTimeOut.addEventListener('change', calculateTimeDifference);

    // Switch Steps
    document.getElementById('btn-next-step-2').addEventListener('click', () => {
      if (!document.getElementById('ot-date').value) {
        alert('กรุณาเลือกวันที่ต้องการขอทำ OT');
        return;
      }
      if (calculateTimeDifference() <= 0) {
        alert('กรุณาเลือกเวลาเริ่มและเวลาสิ้นสุดให้ถูกต้อง');
        return;
      }
      step1.classList.add('hidden');
      step2.classList.remove('hidden');
      stepBadge.textContent = '2';
      stepTitleText.textContent = 'ส่วนที่ 2: ข้อมูลงานและผู้อนุมัติ';
    });

    document.getElementById('btn-back-step-1').addEventListener('click', () => {
      step2.classList.add('hidden');
      step1.classList.remove('hidden');
      stepBadge.textContent = '1';
      stepTitleText.textContent = 'ส่วนที่ 1: ข้อมูลเวลาปฏิบัติงาน';
    });

    // Submit Action
    document.getElementById('btn-submit-ot').addEventListener('click', async () => {
      const project = document.getElementById('ot-project').value;
      const reason = document.getElementById('ot-reason').value.trim();
      const approver = document.getElementById('ot-approver').value;

      if (!project || !reason || !approver) {
        alert('กรุณากรอกข้อมูลงาน เหตุผล และเลือกผู้อนุมัติให้ครบถ้วน');
        return;
      }

      const response = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'request_ot',
          userId: currentUser.userId,
          timeIn: `${document.getElementById('ot-date').value} ${otTimeIn.value}`,
          timeOut: `${document.getElementById('ot-date').value} ${otTimeOut.value}`,
          totalHours: calcResultText.textContent,
          project: project,
          reason: reason,
          approver: approver
        })
      });

      const result = await response.json();
      if (result.status === 'success') {
        alert('ยื่นคำขอ OT เรียบร้อยแล้ว!');
        otModal.classList.add('hidden');
        location.reload();
      } else {
        alert(result.message);
      }
    });
  </script>
</body>
</html>
